name: thai backend workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Spring Boot (JDK + Maven package)
        uses: ./.github/actions/spring-boot-ci

  build_and_push:
    name: build and push backend image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend (Spring Boot)
        uses: docker/build-push-action@v5
        with:
          context: SpringBoot
          file: SpringBoot/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend:latest
            ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}

  copy_infra:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - uses: actions/checkout@v4

      - name: Copy infra directory
        uses: garygrossgarten/github-action-scp@release
        with:
          local: infra
          remote: infra
          recursive: true
          host: ${{ vars.HOST }}
          username: ${{ secrets.USER }}
          privateKey: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

  deploy:
    runs-on: ubuntu-latest
    needs: copy_infra
    if: github.ref == 'refs/heads/main'
    env:
      INFRA_DIR: /home/${{ secrets.USER }}/infra
      COMPOSE_FILE: /home/${{ secrets.USER }}/infra/docker-compose.yml
    steps:
      - name: Deploy on remote host
        uses: appleboy/ssh-action@master
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          host: ${{ vars.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          envs: RESEND_API_KEY
          script: |
            set -euo pipefail

            if which docker &> /dev/null; then
              :
            else
              curl -fsSL https://get.docker.com -o get-docker.sh
              sh get-docker.sh
            fi

            if [ ! -f /swapfile ]; then
              sudo fallocate -l 1G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=1024
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            mkdir -p ${{ env.INFRA_DIR }}/backups
            df -h || true
            sudo docker system df || true

            DB_CONTAINER=$(sudo docker ps -q -f name=^${{ secrets.POSTGRES_HOST }}$ | head -n 1)
            if [ -n "$DB_CONTAINER" ]; then
              sudo docker exec "$DB_CONTAINER" pg_dump -U ${{ secrets.POSTGRES_USER }} ${{ secrets.POSTGRES_DB }} > ${{ env.INFRA_DIR }}/backups/pg_$(date +%Y%m%d_%H%M%S).sql || true
            fi
            cd ${{ env.INFRA_DIR }}/backups && for f in $(ls -t pg_*.sql 2>/dev/null | tail -n +6); do rm -f "$f"; done || true

            sudo docker compose -f ${{ env.COMPOSE_FILE }} down --remove-orphans || true
            sudo docker image prune -af || true
            sudo docker builder prune -af || true

            :> ${{ env.INFRA_DIR }}/.env
            chmod 640 ${{ env.INFRA_DIR }}/.env
            echo DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} >> ${{ env.INFRA_DIR }}/.env
            echo BACKEND_IMAGE_TAG=latest >> ${{ env.INFRA_DIR }}/.env
            echo POSTGRES_DB=${{ secrets.POSTGRES_DB }} >> ${{ env.INFRA_DIR }}/.env
            echo POSTGRES_USER=${{ secrets.POSTGRES_USER }} >> ${{ env.INFRA_DIR }}/.env
            echo POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} >> ${{ env.INFRA_DIR }}/.env
            echo POSTGRES_HOST=${{ secrets.POSTGRES_HOST }} >> ${{ env.INFRA_DIR }}/.env
            echo POSTGRES_PORT=${{ secrets.POSTGRES_PORT }} >> ${{ env.INFRA_DIR }}/.env
            echo ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }} >> ${{ env.INFRA_DIR }}/.env
            echo ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }} >> ${{ env.INFRA_DIR }}/.env
            echo ADMIN_SECRET_KEY=${{ secrets.ADMIN_SECRET_KEY }} >> ${{ env.INFRA_DIR }}/.env
            echo CORS_ORIGINS=${{ secrets.CORS_ORIGINS }} >> ${{ env.INFRA_DIR }}/.env
            echo API_PORT=${{ vars.API_PORT }} >> ${{ env.INFRA_DIR }}/.env
            printf 'RESEND_API_KEY=%s\n' "${RESEND_API_KEY:-}" >> ${{ env.INFRA_DIR }}/.env

            on_fail() {
              sudo docker logs backend --tail 300 2>/dev/null || true
              sudo docker logs mailserver --tail 200 2>/dev/null || true
              sudo docker logs ${{ secrets.POSTGRES_HOST }} --tail 200 2>/dev/null || true
              exit 1
            }
            trap on_fail ERR

            sudo docker compose -f ${{ env.COMPOSE_FILE }} up -d --wait --wait-timeout 300

            sudo docker run --rm --network host postgres:16-alpine \
              psql "postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@127.0.0.1:${{ secrets.POSTGRES_PORT }}/${{ secrets.POSTGRES_DB }}?sslmode=disable" \
              -v ON_ERROR_STOP=1 -c "SELECT 1"

            curl -fsS -o /dev/null "http://127.0.0.1:${{ vars.API_PORT }}/${{ vars.HEALTH_ENDPOINT }}"

            if [ -d ${{ env.INFRA_DIR }}/media ] && [ "$(ls -A ${{ env.INFRA_DIR }}/media 2>/dev/null)" ]; then
              sudo docker run --rm \
                -v ${{ env.INFRA_DIR }}/media:/src:ro \
                -v thai_media:/dest \
                alpine sh -c 'mkdir -p /dest && cp -a /src/. /dest/ && chmod -R a+rX /dest'
            fi
