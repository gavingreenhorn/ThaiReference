name: thai backend workflow

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "Framework for API image"
        required: true
        type: choice
        default: FastAPI
        options:
          - FastAPI
          - SpringBoot

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FastAPI (Python + flake8)
        if: github.event.inputs.backend == 'FastAPI'
        uses: ./.github/actions/fastapi-ci

      - name: Spring Boot (JDK + Maven package)
        if: github.event.inputs.backend == 'SpringBoot'
        uses: ./.github/actions/spring-boot-ci

  build_and_push:
    name: build and push backend image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend (FastAPI)
        if: github.event.inputs.backend == 'FastAPI'
        uses: docker/build-push-action@v5
        with:
          context: fast_api
          file: fast_api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend:latest
            ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}

      - name: Build and push backend (Spring Boot)
        if: github.event.inputs.backend == 'SpringBoot'
        uses: docker/build-push-action@v5
        with:
          context: SpringBoot
          file: SpringBoot/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend:latest
            ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}

  copy_infra:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - uses: actions/checkout@v4

      - name: Copy infra directory
        uses: garygrossgarten/github-action-scp@release
        with:
          local: infra
          remote: infra
          recursive: true
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          privateKey: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

  deploy:
    runs-on: ubuntu-latest
    needs: copy_infra
    if: github.ref == 'refs/heads/main'
    env:
      INFRA_DIR: /home/${{ secrets.USER }}/infra
      COMPOSE_FILE: /home/${{ secrets.USER }}/infra/docker-compose.yml
    steps:
      - name: Deploy on remote host
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script: |
            set -euo pipefail

            if which docker &> /dev/null; then
              echo "docker already installed, skipping installation";
            else
              curl -fsSL https://get.docker.com -o get-docker.sh
              sh get-docker.sh
            fi

            # Ensure swap exists (prevents OOM kills on small VPS)
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 1G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=1024
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            mkdir -p ${{ env.INFRA_DIR }}/backups
            df -h || true
            sudo docker system df || true

            sudo docker compose -f ${{ env.COMPOSE_FILE }} down --remove-orphans || true
            sudo docker image prune -af || true
            sudo docker builder prune -af || true

            DB_CONTAINER=$(sudo docker ps -aq -f name=^${{ secrets.POSTGRES_HOST }}$ | head -n 1)
            if [ -n "$DB_CONTAINER" ]; then
              sudo docker exec "$DB_CONTAINER" pg_dump -U ${{ secrets.POSTGRES_USER }} ${{ secrets.POSTGRES_DB }} > ${{ env.INFRA_DIR }}/backups/pg_$(date +%Y%m%d_%H%M%S).sql || true
            fi
            cd ${{ env.INFRA_DIR }}/backups && for f in $(ls -t pg_*.sql 2>/dev/null | tail -n +6); do rm -f "$f"; done || true

            :> ${{ env.INFRA_DIR }}/.env
            chmod 640 ${{ env.INFRA_DIR }}/.env
            echo DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} >> ${{ env.INFRA_DIR }}/.env
            echo BACKEND_IMAGE_TAG=latest >> ${{ env.INFRA_DIR }}/.env
            echo POSTGRES_DB=${{ secrets.POSTGRES_DB }} >> ${{ env.INFRA_DIR }}/.env
            echo POSTGRES_USER=${{ secrets.POSTGRES_USER }} >> ${{ env.INFRA_DIR }}/.env
            echo POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} >> ${{ env.INFRA_DIR }}/.env
            echo POSTGRES_HOST=${{ secrets.POSTGRES_HOST }} >> ${{ env.INFRA_DIR }}/.env
            echo POSTGRES_PORT=${{ secrets.POSTGRES_PORT }} >> ${{ env.INFRA_DIR }}/.env
            echo ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }} >> ${{ env.INFRA_DIR }}/.env
            echo ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }} >> ${{ env.INFRA_DIR }}/.env
            echo ADMIN_SECRET_KEY=${{ secrets.ADMIN_SECRET_KEY }} >> ${{ env.INFRA_DIR }}/.env
            echo CORS_ORIGINS=${{ secrets.CORS_ORIGINS }} >> ${{ env.INFRA_DIR }}/.env

            sudo docker compose -f ${{ env.COMPOSE_FILE }} up -d --wait --wait-timeout 300 || {
              echo "=== compose up failed; backend logs ==="
              sudo docker logs backend --tail 300 || true
              echo "=== compose ps ==="
              sudo docker compose -f ${{ env.COMPOSE_FILE }} ps || true
              exit 1
            }

            echo "=== backend logs (startup) ==="
            sudo docker logs backend --tail 300 || true

            smoke() {
              local path="$1"
              echo "=== smoke GET ${path} ==="
              local body
              body=$(curl -fsS "http://127.0.0.1:5001${path}")
              echo "${body:0:500}"
              echo
            }

            on_smoke_fail() {
              echo "=== smoke test failed; backend logs ==="
              sudo docker logs backend --tail 300 || true
              exit 1
            }
            trap on_smoke_fail ERR

            smoke /health
            smoke /thai/sounds
            smoke /thai/consonants
            smoke /thai/vowels
            smoke /thai/numerals
            smoke /thai/homophones
            smoke /thai/clusters
            smoke /thai/marks
            smoke /thai/pronouns
            smoke /thai/positions
            smoke /thai/weekdays
            smoke /thai/celestial-bodies
            smoke /thai/time-of-day
            smoke /thai/hours
            smoke /thai/months

            if [ -d ${{ env.INFRA_DIR }}/media ] && [ "$(ls -A ${{ env.INFRA_DIR }}/media 2>/dev/null)" ]; then
              echo "Syncing ${{ env.INFRA_DIR }}/media into volume thai_media..."
              sudo docker run --rm \
                -v ${{ env.INFRA_DIR }}/media:/src:ro \
                -v thai_media:/dest \
                alpine sh -c 'mkdir -p /dest && cp -a /src/. /dest/'
            fi