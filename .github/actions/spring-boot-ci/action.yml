name: Spring Boot CI
description: JDK 23, Maven CLI, and package build (matches Docker build stage)

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "23"

    - run: |
        sudo apt-get update -y
        sudo apt-get install -y maven
      shell: bash

    - run: |
        cd SpringBoot
        if [ -f ./mvnw ]; then
          chmod +x ./mvnw
          ./mvnw -B -ntp -DskipTests package
        else
          mvn -B -ntp -DskipTests package
        fi
      shell: bash
