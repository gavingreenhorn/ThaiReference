name: FastAPI CI
description: Python 3.12, dependencies, and flake8 on fast_api/

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -r fast_api/requirements.txt
        flake8 fast_api
      shell: bash
