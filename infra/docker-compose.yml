services:
  thai_db:
    container_name: ${POSTGRES_HOST}
    image: postgres:16-alpine
    restart: always
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    env_file:
      - .env
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - thai_pg_data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && psql -v ON_ERROR_STOP=1 -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -c 'SELECT 1'",
        ]
      start_period: 5s
      timeout: 5s
      retries: 3
      interval: 10s

  backend:
    container_name: backend
    image: ${DOCKER_USERNAME}/backend:${BACKEND_IMAGE_TAG}
    restart: always
    env_file:
      - .env
    environment:
      SERVER_PORT: "5000"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseSerialGC"
    depends_on:
      thai_db:
        condition: service_healthy
    volumes:
      - thai_media:/media
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:5000/actuator/health >/dev/null 2>&1 || exit 1",
        ]
      start_period: 120s
      timeout: 10s
      retries: 5
      interval: 15s

  thai_nginx:
    container_name: thai_nginx
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${API_PORT}:5000"
    volumes:
      - thai_media:/media:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5000 || exit 1"]
      start_period: 5s
      timeout: 5s
      retries: 3
      interval: 10s

  mailserver:
    container_name: mailserver
    image: ghcr.io/docker-mailserver/docker-mailserver:17.0.0
    hostname: mail.jonecorp.org
    restart: always
    ports:
      - "25:25"
      - "993:993"
    cap_add:
      - NET_ADMIN
    environment:
      ENABLE_FAIL2BAN: "1"
      ENABLE_RSPAMD: "1"
      PERMIT_DOCKER: none
      POSTMASTER_ADDRESS: postmaster@jonecorp.org
    volumes:
      - mail_data:/var/mail/
      - mail_state:/var/mail-state/
      - mail_logs:/var/log/mail/
      - mail_config:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro

volumes:
  thai_pg_data:
    name: thai_pg_data
  thai_media:
    name: thai_media
  mail_data:
    name: mail_data
  mail_state:
    name: mail_state
  mail_logs:
    name: mail_logs
  mail_config:
    name: mail_config
