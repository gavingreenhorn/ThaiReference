services:
  thai_db:
    container_name: thai_db
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - thai_pg_data:/var/lib/postgresql/data
      - ./postgres/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always

  fast_api:
    container_name: fast_api
    image: ${DOCKER_USERNAME}/fast_api:${BACKEND_IMAGE_TAG}
    restart: always
    env_file:
      - .env
    environment:
      db_host: thai_db
      db_port: "5432"
      db_name: ${POSTGRES_DB}
      db_user: ${POSTGRES_USER}
      db_password: ${POSTGRES_PASSWORD}
      redis_url: "redis://redis:6379"
    depends_on:
      thai_db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - thai_media:/media

  thai_nginx:
    container_name: thai_nginx
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - thai_media:/media:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fast_api

volumes:
  thai_pg_data:
    name: thai_pg_data
  thai_media:
    name: thai_media
