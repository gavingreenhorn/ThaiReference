services:
  thai_db:
    container_name: ${POSTGRES_HOST}
    image: postgres:16-alpine
    restart: always
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fast_api:
    container_name: fast_api
    image: ${DOCKER_USERNAME}/fast_api:${BACKEND_IMAGE_TAG}
    restart: always
    env_file:
      - .env
    depends_on:
      thai_db:
        condition: service_healthy
    volumes:
      - thai_media:/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')\" || exit 1"]
      start_period: 5s
      timeout: 5s
      retries: 3
      interval: 10s
      

  thai_nginx:
    container_name: thai_nginx
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "5001:5000"
    volumes:
      - thai_media:/media:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      fast_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5000 || exit 1"]
      start_period: 5s
      timeout: 5s
      retries: 3
      interval: 10s

volumes:
  thai_pg_data:
    name: thai_pg_data
  thai_media:
    name: thai_media
