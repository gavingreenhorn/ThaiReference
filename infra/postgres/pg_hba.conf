# Managed by infra/docker-compose.yml — reapplied on every container start via hba_file.
# host only (no hostssl): Postgres in this stack does not enable SSL.

local   all   all                 trust
host    all   all   127.0.0.1/32  trust
host    all   all   ::1/128       trust
host    all   all   0.0.0.0/0     scram-sha-256
host    all   all   ::/0          scram-sha-256
