spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS thai
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: thai
        globally_quoted_identifiers: true
        hbm2ddl:
          create_namespaces: true
  flyway:
    enabled: false
