<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>ThaiReference account verification</title>
  <style>
    @media (prefers-color-scheme: dark) {
      .page { background-color: #0f0e17 !important; }
      .card { background-color: #1f1f1f !important; border-color: #e8c547 !important; }
      .heading { color: #f9f8c4 !important; }
      .copy { color: #E1E1E1 !important; }
      .muted { color: #a7a9be !important; }
      .code-panel { background-color: #1a1825 !important; border-color: #2a2740 !important; }
      .code { color: #ac99ea !important; }
      .divider { border-color: #2a2740 !important; }
    }
    @media screen and (max-width: 480px) {
      .outer { padding: 24px 12px !important; }
      .content { padding: 28px 20px !important; }
      .code { font-size: 32px !important; letter-spacing: 6px !important; }
    }
  </style>
</head>
<body class="page" style="margin: 0; padding: 0; background-color: #f5f5f5; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">
  <div style="display: none; max-height: 0; overflow: hidden; opacity: 0; mso-hide: all;">Use your verification code in ThaiReference to complete your request.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="page" bgcolor="#f5f5f5" style="background-color: #f5f5f5;">
    <tr>
      <td align="center" class="outer" style="padding: 48px 16px;">
        <!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="card" bgcolor="#ffffff" style="width: 100%; max-width: 560px; background-color: #ffffff; border: 1px solid #b8860b; border-radius: 12px; border-spacing: 0; font-family: 'Open Sans', Arial, sans-serif;">
          <tr>
            <td bgcolor="#073B47" style="padding: 24px 28px; background-color: #073B47; border-radius: 11px 11px 0 0;">
              <p style="margin: 0; color: #FFD166; font-size: 22px; line-height: 30px; font-weight: 700;">ThaiReference</p>
              <p style="margin: 4px 0 0; color: #baffc4; font-size: 12px; line-height: 20px; letter-spacing: 2px;">YOUR THAI LANGUAGE COMPANION</p>
            </td>
          </tr>
          <tr>
            <td class="content" style="padding: 36px 32px;">
              <h1 class="heading" style="margin: 0 0 16px; color: #242424; font-size: 26px; line-height: 34px; font-weight: 700;">{{{TITLE}}}</h1>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" class="code-panel" bgcolor="#f5f5f5" style="padding: 24px 12px; background-color: #f5f5f5; border: 1px solid #e0e0e0; border-radius: 12px;">
                    <p class="muted" style="margin: 0 0 12px; color: #666666; font-size: 12px; line-height: 18px; letter-spacing: 2px;">VERIFICATION CODE</p>
                    <p class="code" style="margin: 0; color: #512BD4; font-family: Consolas, 'Courier New', monospace; font-size: 40px; line-height: 52px; font-weight: 700; letter-spacing: 8px; white-space: nowrap;">{{{CODE}}}</p>
                  </td>
                </tr>
              </table>
              <p class="copy" style="margin: 24px 0 0; color: #404040; font-size: 14px; line-height: 24px;">{{{INSTRUCTIONS}}}</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td class="divider" style="padding-top: 28px; border-bottom: 1px solid #e0e0e0; font-size: 0; line-height: 0;">&nbsp;</td>
                </tr>
              </table>
              <p class="muted" style="margin: 20px 0 0; color: #666666; font-size: 13px; line-height: 22px;">If you did not request this code, you can ignore this email.</p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
        <p class="muted" style="margin: 20px 0 0; color: #666666; font-family: 'Open Sans', Arial, sans-serif; font-size: 12px; line-height: 20px;">ThaiReference &middot; jonecorp.org</p>
      </td>
    </tr>
  </table>
</body>
</html>
